<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORIS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names="
    />
    <script src="../js/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href="./index.html">
          <img src="../images/common/logo1.png" alt="MORIS" />
        </a>
      </h1>

      <nav class="gnb">
        <!-- ul>li*>a -->
        <ul class="ul">
          <li class="list list1"><a href="#">상품소개</a></li>
          <li class="list list2"><a href="#">회사소개</a></li>
          <li class="list list3"><a href="#">연구개발</a></li>
          <li class="list list4"><a href="#">홍보센터</a></li>
          <li class="list list5"><a href="#">문의하기</a></li>
        </ul>
      </nav>
    </header>
    <!-- header end -->
    <main>
      <section class="main-visual swiper">
        <ul class="swiper-wrapper visual-list">
          <li class="visual01 swiper-slide">
            <a href=""
              ><img class="main01" src="../images/main/visual01.jpg" alt=""
            /></a>
          </li>
          <li class="visual02 swiper-slide">
            <a href=""
              ><img class="main02" src="../images/main/visual02.jpg" alt=""
            /></a>
          </li>
          <li class="visual03 swiper-slide">
            <a href=""
              ><img class="main03" src="../images/main/visual03.jpg" alt=""
            /></a>
          </li>
          <li class="visual04 swiper-slide">
            <a href=""
              ><img class="main04" src="../images/main/visual04.jpg" alt=""
            /></a>
          </li>
        </ul>
      </section>

      <section class="floating">
        <button class="floatx-btn" type="button" aria-label="팝업 닫기">
          <img src="../images/common/floating_close.svg" alt="" />
        </button>

        <div class="popup">
          <img
            class="popup-logo"
            src="../images/common/floating_logo.svg"
            alt="MORIS"
          />

          <div class="popup-content">
            <a href="#" class="popup-store">
              <span>온라인 스토어<br />바로가기</span>
              <span class="arrow">↗</span>
            </a>

            <a href="#" class="popup-inquiry">
              <span>대량 구매 문의</span>
              <span class="arrow">↗</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
