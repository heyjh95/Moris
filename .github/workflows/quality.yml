name: MORIS quality
on:
  push:
    branches: [main, main2, "refactor/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
